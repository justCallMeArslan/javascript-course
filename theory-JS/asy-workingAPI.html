<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API</title>
    <style>
        .main-cont {
            display: flex;
            flex-direction: column;
            max-width: 400px;
            width: 100%;
        }

        input {
            margin-bottom: 5px;
        }

        button {
            margin-bottom: 20px;
        }
    </style>
</head>


<body>

    <div class="main-cont">

        <label for="random">Vibe pick:</label>
        <input type="text" id="randomChoice" name="random">
        <button type="submit">Submit</button>

        <img src="#" alt="#">
    </div>

    <script>
        const API_KEY = "SQBIPDZMvsD3WpwaYrEwdsvOf7fPm86I"; // old one is deleted

        const random = Math.floor(Math.random() * 100);
        const input = document.querySelector('#randomChoice')
        const img = document.querySelector('img');
        const submitBtn = document.querySelector('button');


        async function getRandomGif() {
            try {
                const response = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${API_KEY}&q=random&limit=1&offset=${random}`);
                const gifData = await response.json();
                img.src = gifData.data[0].images.original.url;
            } catch (err) {
                console.error("Fetch error", err);
                img.alt = "Failed to load GIF"
            }
        }

        async function getVibedGif() {
            try {
                const search = input.value.trim();
                const random = Math.floor(Math.random() * 100);

                const response = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${API_KEY}&q=${search}&limit=1&offset=${random}`)
                const vibedData = await response.json();
                img.src = vibedData.data[0].images.original.url;
            } catch (err) {
                console.error("Fetch error", err);
                img.alt = "Failed to load GIF"
            }

        }

        getRandomGif();

        submitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            getVibedGif();
        })

    </script>



</body>

</html>
